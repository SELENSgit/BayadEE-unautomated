<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Fines Lookup | SELENS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
    }
    .header {
      background-color: #000000;
      color: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid #ffcc00;
    }
    .header .logo img {
      max-width: 140px;
      height: auto;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .container {
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 2px solid #ffcc00;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #000000;
    }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background-color: #ffcc00;
      color: #000000;
      border: none;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #e6b800;
    }
    .record-card {
      border: 1px solid #e0e0e0;
      border-left: 6px solid #ffcc00;
      border-radius: 6px;
      padding: 20px;
      margin-top: 15px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .record-card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #000000;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 8px;
    }
    .record-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }
    .record-grid p {
      margin: 4px 0;
      font-size: 14px;
    }
    .badge-paid {
      color: #28a745;
      font-weight: bold;
    }
    .badge-pending {
      color: #dc3545;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <img src="SELENS Logo.png" alt="SELENS Logo">
    </div>
    <h1>SELENS Student Fines Lookup</h1>
  </div>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter Student ID or Full Name..." />
      <button onclick="searchFine()">Search</button>
    </div>

    <div id="result"></div>
  </div>

  <!-- SheetJS CDN for parsing Excel files -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    let studentData = [];

    // Automatically load fines.xlsx on page startup
    window.addEventListener('DOMContentLoaded', () => {
      fetch('fines.xlsx')
        .then(res => {
          if (!res.ok) throw new Error("Could not load fines.xlsx");
          return res.arrayBuffer();
        })
        .then(buffer => {
          const workbook = XLSX.read(buffer, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          studentData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
        })
        .catch(err => {
          console.error("Data load error:", err);
          document.getElementById('result').innerHTML = 
            '<p class="error">Unable to load fine records. Please make sure fines.xlsx exists in the repository.</p>';
        });
    });

    function searchFine() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (!query) {
        resultDiv.innerHTML = '<p class="error">Please enter a Student ID or Name.</p>';
        return;
      }

      // Matches against Student ID or Full Name
      const matches = studentData.filter(row => {
        const idMatch = String(row['Student ID'] || '').toLowerCase().includes(query);
        const nameMatch = String(row['Full Name'] || '').toLowerCase().includes(query);
        return idMatch || nameMatch;
      });

      if (matches.length > 0) {
        matches.forEach(record => {
          const statusClass = String(record['Status']).toLowerCase() === 'paid' ? 'badge-paid' : 'badge-pending';
          
          const card = document.createElement('div');
          card.className = 'record-card';
          card.innerHTML = `
            <h3>${record['Full Name'] || 'N/A'}</h3>
            <div class="record-grid">
              <p><strong>Student ID:</strong> ${record['Student ID'] || 'N/A'}</p>
              <p><strong>TXN ID:</strong> ${record['TXN ID'] || 'N/A'}</p>
              <p><strong>Email:</strong> ${record['Email Address'] || 'N/A'}</p>
              <p><strong>Event / Offense:</strong> ${record['Event / Offense'] || 'N/A'}</p>
              <p><strong>Fine Amount:</strong> ₱${record['Fine Amount'] || '0'}</p>
              <p><strong>Date Issued:</strong> ${record['Date'] || 'N/A'}</p>
              <p><strong>Status:</strong> <span class="${statusClass}">${record['Status'] || 'N/A'}</span></p>
              <p><strong>Date Paid:</strong> ${record['Date Paid'] || 'N/A'}</p>
            </div>
          `;
          resultDiv.appendChild(card);
        });
      } else {
        resultDiv.innerHTML = '<p class="error">No record found matching your query.</p>';
      }
    }
  </script>
</body>
</html>
